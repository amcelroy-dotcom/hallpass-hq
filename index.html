<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall Pass — SANY</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: #8F0018; --navy: #0A1B33; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Work Sans', system-ui, sans-serif;
    background: var(--navy); color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .mono { font-family: 'Space Grotesk', system-ui, sans-serif; }

  /* ---- Config bar (dev-only, remove/hide for real deploy) ---- */
  #apiConfig { width: 100%; max-width: 480px; padding: 10px 16px; }
  #apiConfig input {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    color: #fff; font-size: 11px;
  }
  #apiConfig label { font-size: 10px; color: #7C8AA8; }

  /* ---- Header ---- */
  header {
    width: 100%; padding: 16px 20px; display: flex; align-items: center;
    justify-content: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header .title { font-size: 18px; font-weight: 700; }

  /* ---- Screens ---- */
  .screen { width: 100%; max-width: 480px; padding: 20px; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* Scan screen */
  #videoWrap {
    position: relative; width: 100%; aspect-ratio: 4/3; background: #061224;
    border-radius: 16px; overflow: hidden; margin-bottom: 14px;
  }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  canvas { display: none; }
  #status { padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.08); margin-bottom: 18px; }
  #status.ok { background: rgba(34,197,94,0.18); color: #4ADE80; }
  #status.err { background: rgba(239,68,68,0.18); color: #FF6B7F; }
  .divider { margin: 8px 0 14px; color: #5B6A87; font-size: 13px; }
  #pinBoxes { display: flex; gap: 8px; }
  #pinBoxes input {
    width: 15%; aspect-ratio: 1/1.15; text-align: center; font-size: 22px;
    border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); color: #fff;
  }

  /* Identify/confirm screen */
  #studentBanner {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 16px; margin-bottom: 18px;
  }
  #studentBanner .name { font-size: 20px; font-weight: 700; }
  #studentBanner .meta { font-size: 13px; color: #7C8AA8; margin-top: 2px; }
  .sectionLabel { font-size: 12px; font-weight: 700; color: #7C8AA8; letter-spacing: 0.04em; align-self: flex-start; margin-bottom: 8px; }
  #teacherSearch {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; margin-bottom: 8px;
  }
  #teacherList { width: 100%; max-height: 160px; overflow-y: auto; margin-bottom: 18px; }
  #teacherList .opt {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #teacherList .opt:hover, #teacherList .opt.selected { background: rgba(255,255,255,0.08); }
  #teacherList .opt.selected { border: 1px solid var(--accent); }
  #reasonGrid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .reasonBtn {
    padding: 14px 10px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .reasonBtn.selected { border-color: var(--accent); background: rgba(143,0,24,0.18); }
  #confirmBtn, #cancelBtn {
    width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  #confirmBtn { background: var(--accent); color: #fff; margin-bottom: 8px; }
  #confirmBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #cancelBtn { background: transparent; color: #7C8AA8; }

  /* Toast */
  #toast {
    position: fixed; right: 20px; bottom: 20px; width: min(390px, calc(100% - 40px));
    background: #12233F; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
    padding: 16px 18px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.35); transform: translateY(140%); transition: transform 0.3s ease;
  }
  #toast.show { transform: translateY(0); }
  #toast .icon { width: 40px; height: 40px; border-radius: 11px; background: rgba(74,222,128,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #toast .name { font-weight: 700; font-size: 14px; }
  #toast .meta { font-size: 12.5px; color: #7C8AA8; }

  /* Reject overlay */
  #rejectOverlay {
    position: fixed; inset: 0; background: linear-gradient(180deg, #9E001D 0%, #6B0011 100%);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; padding: 20px;
  }
  #rejectOverlay.show { display: flex; }
  #rejectOverlay .big { font-size: 40px; font-weight: 700; margin-bottom: 10px; }
  #rejectOverlay .sub { font-size: 16px; color: #FFD8DD; }
  #log { width: 100%; max-width: 480px; font-size: 10px; color: #5B6A87; white-space: pre-wrap; max-height: 100px; overflow-y: auto; padding: 8px 20px; }
</style>
</head>
<body>

<div id="apiConfig">
  <label for="apiUrl">Apps Script /exec URL:</label>
  <input id="apiUrl" type="text" placeholder="https://script.google.com/.../exec">
</div>

<header>
  <div class="title">SANY Hall Pass</div>
</header>

<!-- SCREEN: scanning -->
<div class="screen active" id="screenScan">
  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Requesting camera…</div>
  <div class="divider">— or type your 5-digit lunch PIN —</div>
  <div id="pinBoxes">
    <input maxlength="1" inputmode="numeric" data-i="0">
    <input maxlength="1" inputmode="numeric" data-i="1">
    <input maxlength="1" inputmode="numeric" data-i="2">
    <input maxlength="1" inputmode="numeric" data-i="3">
    <input maxlength="1" inputmode="numeric" data-i="4">
  </div>
</div>

<!-- SCREEN: confirm sign-out -->
<div class="screen" id="screenConfirm">
  <div id="studentBanner">
    <div class="name" id="bannerName"></div>
    <div class="meta" id="bannerMeta"></div>
  </div>
  <div class="sectionLabel">Which teacher are you with right now?</div>
  <input id="teacherSearch" placeholder="Type a name or room number…">
  <div id="teacherList"></div>
  <div class="sectionLabel">Reason</div>
  <div id="reasonGrid"></div>
  <button id="confirmBtn" disabled>Sign Out</button>
  <button id="cancelBtn">Cancel</button>
</div>

<div id="toast">
  <div class="icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <div>
    <div class="name mono" id="toastName"></div>
    <div class="meta" id="toastMeta"></div>
  </div>
</div>

<div id="rejectOverlay">
  <div class="big mono" id="rejectBig">Pass denied</div>
  <div class="sub" id="rejectSub"></div>
</div>

<div id="log"></div>

<script>
  // ---------- State ----------
  let currentStudent = null;   // { name, pin }
  let selectedTeacher = null;  // { displayName, room, email }
  let selectedReason = null;
  let teachers = [];
  let cooldownUntil = 0;       // prevent re-triggering the same scan repeatedly

  const apiUrlInput = document.getElementById('apiUrl');
  apiUrlInput.value = localStorage.getItem('hallpass_api_url') || '';
  apiUrlInput.addEventListener('change', () => localStorage.setItem('hallpass_api_url', apiUrlInput.value.trim()));

  function api() { return apiUrlInput.value.trim(); }
  function log(msg) {
    const el = document.getElementById('log');
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + el.textContent;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function apiGet(action, params) {
    if (!api()) { flashStatus('No Apps Script URL set — paste it in the box above.'); throw new Error('no_api_url'); }
    try {
      const url = new URL(api());
      url.searchParams.set('action', action);
      Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString());
      return await res.json();
    } catch (err) {
      log('API GET failed: ' + err.message);
      flashStatus('Could not reach the server. Check the API URL above.');
      throw err;
    }
  }

  async function apiPost(body) {
    if (!api()) { flashStatus('No Apps Script URL set — paste it in the box above.'); throw new Error('no_api_url'); }
    try {
      const res = await fetch(api(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (err) {
      log('API POST failed: ' + err.message);
      flashStatus('Could not reach the server. Check the API URL above.');
      throw err;
    }
  }

  // ---------- Camera scan loop ----------
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = document.getElementById('status');
  let lastDecoded = '', lastDecodedAt = 0;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      video.srcObject = stream;
      statusEl.textContent = 'Camera ready — scanning continuously';
      statusEl.className = 'ok';
      requestAnimationFrame(tick);
    })
    .catch(err => {
      statusEl.textContent = 'Camera failed: ' + err.name;
      statusEl.className = 'err';
      log('getUserMedia error: ' + err.message);
    });

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA && Date.now() > cooldownUntil) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        const now = Date.now();
        if (code.data !== lastDecoded || now - lastDecodedAt > 3000) {
          lastDecoded = code.data; lastDecodedAt = now;
          identifyByName(code.data);
        }
      }
    }
    requestAnimationFrame(tick);
  }

  // ---------- PIN entry ----------
  const boxes = Array.from(document.querySelectorAll('#pinBoxes input'));
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/[^0-9]/g, '');
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      trySubmitPin();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
      if (e.key === 'Enter') trySubmitPin(true);
    });
  });

  function trySubmitPin(forced) {
    const pin = boxes.map(b => b.value).join('');
    if (pin.length === 5 || forced) {
      if (pin.length !== 5) return;
      identifyByPin(pin);
      boxes.forEach(b => b.value = '');
    }
  }

  // ---------- Identify student, then route to sign-in or the confirm screen ----------
  async function identifyByName(text) {
    log('QR decoded: "' + text + '"');
    const res = await apiGet('lookupByName', { name: text });
    handleIdentifyResult(res, text);
  }
  async function identifyByPin(pin) {
    log('PIN submitted: ' + pin);
    const res = await apiGet('lookupByPin', { pin: pin });
    handleIdentifyResult(res, pin);
  }

  async function handleIdentifyResult(res, queried) {
    if (!res.found) {
      log('No match for "' + queried + '"');
      flashStatus('No student found for that ' + (queried.length === 5 ? 'PIN' : 'badge'));
      return;
    }
    currentStudent = { name: res.name, pin: res.pin };
    const status = await apiGet('getStudentStatus', { name: res.name });

    if (status.currentlyOut) {
      // Second tap = sign back in, no picker needed
      const signIn = await apiPost({ action: 'signIn', name: res.name });
      if (signIn.success) {
        showToast(res.name + ' signed back in', signIn.durationMinutes + ' min pass · ' + status.remaining + ' remaining today');
        cooldown();
      } else {
        flashStatus(signIn.error || 'Could not sign in.');
      }
      return;
    }

    openConfirmScreen(status);
  }

  function flashStatus(msg) {
    statusEl.textContent = msg;
    statusEl.className = 'err';
    setTimeout(() => { statusEl.textContent = 'Camera ready — scanning continuously'; statusEl.className = 'ok'; }, 2500);
  }

  function cooldown() {
    cooldownUntil = Date.now() + 2000;
  }

  // ---------- Confirm screen: teacher picker + reason ----------
  async function openConfirmScreen(status) {
    document.getElementById('bannerName').textContent = currentStudent.name;
    document.getElementById('bannerMeta').textContent =
      status.usedToday + ' of ' + status.limit + ' passes used today · ' + status.remaining + ' remaining';

    selectedTeacher = null;
    selectedReason = null;
    document.getElementById('confirmBtn').disabled = true;
    document.getElementById('teacherSearch').value = '';

    if (teachers.length === 0) {
      const t = await apiGet('getTeachers', {});
      teachers = t.teachers || [];
    }
    renderTeacherList(teachers);
    renderReasons();
    showScreen('screenConfirm');
  }

  function renderTeacherList(list) {
    const el = document.getElementById('teacherList');
    el.innerHTML = '';
    list.slice(0, 30).forEach(t => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.textContent = t.displayName + (t.room ? ' — Rm ' + t.room : '');
      div.addEventListener('click', () => {
        selectedTeacher = t;
        document.querySelectorAll('#teacherList .opt').forEach(o => o.classList.remove('selected'));
        div.classList.add('selected');
        updateConfirmEnabled();
      });
      el.appendChild(div);
    });
  }

  document.getElementById('teacherSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q
      ? teachers.filter(t => t.displayName.toLowerCase().includes(q) || String(t.room).toLowerCase().includes(q))
      : teachers;
    renderTeacherList(filtered);
  });

  const REASONS = ['Bathroom', 'Drink', 'Nurse', 'Locker', 'Main Office', 'Behavior Specialist', 'Counselor', 'Other'];
  function renderReasons() {
    const el = document.getElementById('reasonGrid');
    el.innerHTML = '';
    REASONS.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'reasonBtn';
      btn.textContent = r;
      btn.addEventListener('click', () => {
        selectedReason = r;
        document.querySelectorAll('.reasonBtn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateConfirmEnabled();
      });
      el.appendChild(btn);
    });
  }

  function updateConfirmEnabled() {
    document.getElementById('confirmBtn').disabled = !(selectedTeacher && selectedReason);
  }

  document.getElementById('cancelBtn').addEventListener('click', () => {
    currentStudent = null;
    showScreen('screenScan');
  });

  document.getElementById('confirmBtn').addEventListener('click', async () => {
    document.getElementById('confirmBtn').disabled = true;
    const res = await apiPost({
      action: 'signOut',
      name: currentStudent.name,
      teacher: selectedTeacher.displayName,
      room: selectedTeacher.room,
      reason: selectedReason
    });

    if (res.success) {
      showToast(currentStudent.name + ' signed out', selectedReason + ' · ' + res.remaining + ' passes remaining today');
      showScreen('screenScan');
      cooldown();
    } else if (res.reasonCode === 'limit_reached') {
      showReject('Pass denied', currentStudent.name + ' has used all ' + res.limit + ' hall passes allowed for today.');
    } else if (res.reasonCode === 'already_out') {
      showReject('Already out', currentStudent.name + ' already has an open pass.');
    } else {
      showReject('Something went wrong', res.error || 'Please try again or ask a teacher for help.');
    }
  });

  // ---------- Toast / reject ----------
  function showToast(name, meta) {
    document.getElementById('toastName').textContent = name;
    document.getElementById('toastMeta').textContent = meta;
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function showReject(big, sub) {
    document.getElementById('rejectBig').textContent = big;
    document.getElementById('rejectSub').textContent = sub;
    document.getElementById('rejectOverlay').classList.add('show');
    setTimeout(() => {
      document.getElementById('rejectOverlay').classList.remove('show');
      showScreen('screenScan');
      cooldown();
    }, 6000);
  }
</script>
</body>
</html>
